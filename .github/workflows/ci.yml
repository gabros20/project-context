name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Verify release contract
        run: python scripts/check_release.py v0.7.0

      - name: Validate bootstrap syntax
        shell: bash
        run: sh -n site/install.sh

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python entry points
        run: python -m py_compile scripts/ctx.py scripts/install.py scripts/check_release.py

  validate-powershell:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Validate PowerShell bootstrap syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "site/install.ps1",
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

